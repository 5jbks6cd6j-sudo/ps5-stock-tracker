name: PS5 Pro Stock Tracker

on:
  schedule:
    # Runs every 15 minutes (minimum allowed by GitHub is 5 minutes: '*/5 * * * *')
    - cron: '*/15 * * * *'
  # Enables a "Run workflow" button in GitHub UI for instant testing
  workflow_dispatch:

jobs:
  check-stock:
    runs-on: ubuntu-latest
    # Pre-installed Playwright + Chromium container avoids slow browser downloads
    container:
      image: mcr.microsoft.com/playwright/python:v1.58.0-noble

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Python packages
        run: pip install -r requirements.txt

      - name: Run PlayStation Direct check
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python check_ps_direct.py

      - name: Run Worten check
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python check_worten.py